name: Build and Push

on:
  push:
    tags:
      - '*/v*'

permissions:
  contents: read

jobs:
  build:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Parse tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          service="${REF_NAME%%/*}"
          case "$service" in
            ap|lan|net-init) ;;
            *)
              echo "::error::unrecognized service '$service' in tag '$REF_NAME'. expected one of: ap, lan, net-init"
              exit 1
              ;;
          esac

          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "Building mezz-$service from tag $REF_NAME"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: abgeo/mezz-${{ steps.tag.outputs.service }}
          labels: |
            org.opencontainers.image.title=mezz-${{ steps.tag.outputs.service }}
          tags: |
            type=semver,pattern=v{{version}},match=v(\d.\d.\d)$
            type=semver,pattern=v{{major}}.{{minor}},match=v(\d.\d.\d)$
            type=semver,pattern=v{{major}},match=v(\d.\d.\d)$

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: images/${{ steps.tag.outputs.service }}
          build-contexts: |
            lib=images/lib
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mezz-${{ steps.tag.outputs.service }}
          cache-to: type=gha,mode=max,scope=mezz-${{ steps.tag.outputs.service }}
